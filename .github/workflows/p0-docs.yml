name: Noble AI · docs and Model Hub API checks

on:
  push:
  pull_request:

concurrency:
  group: noble-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Noble control plane dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Run all offline tests (provider mocked, not GPU)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Probe public Hugging Face live API (nonblocking, network-dependent)
        continue-on-error: true
        run: python scripts/probe_hf_catalog.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API dependencies for UI smoke
        run: python -m pip install -r apps/api/requirements.txt
      - name: Install and build frontend
        run: |
          set -euo pipefail
          cd apps/web
          npm install --include=optional --no-audit --no-fund
          # npm can omit Rollup's native optional binary on a fresh Linux runner.
          # Detect the missing runtime before Vite starts; install the matching
          # pinned version rather than silently hiding genuine build failures.
          if ! node -e "require('@rollup/rollup-linux-x64-gnu')" >/dev/null 2>&1; then
            VERSION="$(node -p "require('./node_modules/rollup/package.json').version")"
            npm install --no-save --no-package-lock --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@$VERSION"
          fi
          npm run build
      - name: Install Playwright Chromium
        run: cd apps/web && npx playwright install chromium --with-deps
      - name: Browser smoke (real Noble API, desktop and mobile)
        run: |
          python -m uvicorn noble_api.main:app --app-dir apps/api --host 127.0.0.1 --port 8000 >/tmp/noble-api.log 2>&1 &
          API_PID=$!
          npm --prefix apps/web run dev >/tmp/noble-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $API_PID $WEB_PID 2>/dev/null || true' EXIT
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/api/v1/health
          cd apps/web
          # Catch high-impact English UI/selector mismatches before the full suite.
          npx playwright test tests/app.spec.ts tests/creator-ai.spec.ts tests/settings-separation.spec.ts --project=desktop --workers=2
          npm run test:e2e
      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noble-ai-visual-qa
          path: apps/web/test-results/
          retention-days: 7

