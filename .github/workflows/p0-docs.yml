name: Noble AI · docs and Model Hub API checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Noble control plane dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Run all offline tests (provider mocked, not GPU)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build frontend
        run: cd apps/web && npm install --no-audit --no-fund && npm run build
