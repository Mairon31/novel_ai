name: P0 documentation and config checks
on:
  push:
  pull_request:
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate documentation, JSON and notebook structure (not GPU)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
